version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: qbitleap-qbitleapbtc_dashboard_1
      APP_PORT: 8080
      PROXY_AUTH_ADD: "false"

  dashboard:
    image: ghcr.io/qbitleap/qbitleapbtc-dashboard:0.5.7
    restart: unless-stopped
    environment:
      DASHBOARD_PORT: "8080"
      QBIT_RPC_HOST: qbitd
      QBIT_RPC_PORT: "8352"
      QBIT_RPC_USER: qbitrpc
      QBIT_RPC_PASSWORD: ${APP_PASSWORD}
      BITCOIN_RPC_HOST: ${APP_BITCOIN_NODE_IP}
      BITCOIN_RPC_PORT: ${APP_BITCOIN_RPC_PORT}
      BITCOIN_RPC_USER: ${APP_BITCOIN_RPC_USER}
      BITCOIN_RPC_PASSWORD: ${APP_BITCOIN_RPC_PASS}
      FRACTAL_RPC_HOST: ${APP_FRACTAL_RPC_HOST}
      FRACTAL_RPC_PORT: ${APP_FRACTAL_RPC_PORT}
      FRACTAL_RPC_USER: ${APP_FRACTAL_RPC_USER}
      FRACTAL_RPC_PASSWORD: ${APP_FRACTAL_RPC_PASS}
      AUXPOW_HOST: auxpow
      AUXPOW_PORT: "3336"
      AUXPOW_RENTAL_HOST: auxpow_rental
      AUXPOW_RENTAL_PORT: "4335"
      PERMISSIONLESS_HOST: permissionless
      PERMISSIONLESS_PORT: "3333"
      CONFIG_DIR: /config
      TELEMETRY_FILE: /telemetry/telemetry.json
      PERMISSIONLESS_TELEMETRY_FILE: /telemetry/permissionless.json
      MODE_FILE: /config/mining-mode.txt
      ROUTER_STATUS_FILE: /telemetry/router-status.json
    volumes:
      - ${APP_DATA_DIR}/config:/config
      - ${APP_DATA_DIR}/telemetry:/telemetry:ro
    depends_on:
      qbitd:
        condition: service_healthy

  qbit_config:
    image: alpine:3.21
    restart: "no"
    volumes:
      - ${APP_DATA_DIR}/config:/config
    command:
      - /bin/sh
      - -c
      - |
        set -eu

        mkdir -p /config

        cat > /config/qbit.conf <<'EOF_CONFIG'
        # QBitLeap managed configuration

        server=1
        txindex=1
        rpcbind=0.0.0.0
        zmqpubrawblock=tcp://0.0.0.0:28332
        zmqpubrawtx=tcp://0.0.0.0:28333
        EOF_CONFIG

        touch /config/qbt-payout-address.txt
        touch /config/btc-payout-address.txt
        touch /config/fractal-payout-address.txt
        test -s /config/mining-mode.txt || echo auxpow > /config/mining-mode.txt
        chmod 600 /config/qbit.conf
        chmod 600 /config/qbt-payout-address.txt
        chmod 600 /config/btc-payout-address.txt
        chmod 600 /config/fractal-payout-address.txt
        chmod 600 /config/mining-mode.txt

  qbitd:
    image: ghcr.io/qbitleap/qbitleapbtc-qbitd:0.5.7
    restart: unless-stopped
    stop_grace_period: 2m

    depends_on:
      qbit_config:
        condition: service_completed_successfully

    environment:
      QBIT_PRODUCTION: "1"
      QBIT_TOOLS_PRODUCTION: "1"
      QBIT_CHAIN: mainnet
      CKPOOL_NON_TEST_READINESS_GATE: "1"
      QBIT_MAINNET_LAUNCH_READINESS_CHECKS_ENABLED: "1"

    command:
      - -printtoconsole
      - -conf=/etc/qbit/qbit.conf
      - -datadir=/var/lib/qbit
      - -rpcuser=qbitrpc
      - -rpcpassword=${APP_PASSWORD}
      - -rpcbind=0.0.0.0
      - -rpcallowip=127.0.0.1
      - -rpcallowip=10.0.0.0/8
      - -rpcallowip=172.16.0.0/12
      - -rpcallowip=192.168.0.0/16
      - -rpcworkqueue=64
      - -rpcport=8352
      - -port=8355
      - -listen=1
      - -fallbackfee=0.00001000
      - -chain=main
      - -asert

    ports:
      - "8355:8355"

    volumes:
      - ${APP_DATA_DIR}/config/qbit.conf:/etc/qbit/qbit.conf:ro
      - ${APP_DATA_DIR}/qbit:/var/lib/qbit

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          qbit-cli
          -rpcconnect=127.0.0.1
          -rpcport=8352
          -rpcuser=qbitrpc
          -rpcpassword="${APP_PASSWORD}"
          getblockchaininfo >/dev/null
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  auxpow:
    image: ghcr.io/qbitleap/qbitleapbtc-auxpow:0.5.7
    restart: unless-stopped

    depends_on:
      qbitd:
        condition: service_healthy

    environment: &auxpow_environment
      AUXPOW_MODE: stratum
      AUXPOW_TEMPLATE_MAX_AGE_SECONDS: "120"
      AUXPOW_TEMPLATE_MAX_FUTURE_SECONDS: "7200"
      AUXPOW_STRATUM_REFRESH_FAILURE_EXIT_SECONDS: "120"
      AUXPOW_STRATUM_BIND: 0.0.0.0
      AUXPOW_STRATUM_PORT: "3336"
      AUXPOW_STRATUM_SHARE_DIFF: "1"
      AUXPOW_STRATUM_VARDIFF_ENABLED: "1"
      AUXPOW_STRATUM_VARDIFF_TARGET_SHARE_SECONDS: "5"
      AUXPOW_STRATUM_VARDIFF_MIN_DIFF: "1024"
      AUXPOW_STRATUM_VARDIFF_MAX_DIFF: "4294967296"
      AUXPOW_STRATUM_VARDIFF_RETARGET_SECONDS: "120"
      AUXPOW_STRATUM_VARDIFF_MAX_STEP_FACTOR: "4"
      AUXPOW_STRATUM_VARDIFF_MAX_STEP_DOWN_FACTOR: "2"
      AUXPOW_STRATUM_VARDIFF_EWMA_ALPHA: "0.4"
      AUXPOW_STRATUM_VARDIFF_RETARGET_TOLERANCE: "0.25"
      AUXPOW_STRATUM_VARDIFF_STARTUP_DIFF: "8192"
      AUXPOW_STRATUM_VARDIFF_APPLY_MODE: next_job
      AUXPOW_STRATUM_MIN_ADVERTISED_DIFF: "0"
      AUXPOW_STRATUM_POLL_SECONDS: "5"
      AUXPOW_STRATUM_JOB_MAX_AGE_SECONDS: "2700"
      AUXPOW_STRATUM_VERSION_MASK: 1fffe000
      AUXPOW_STRATUM_HEADER_VARIANT: canonical
      AUXPOW_STRATUM_ACCEPT_DIAGNOSTIC_VARIANT: "0"
      AUXPOW_STRATUM_STATS_INTERVAL_SECONDS: "60"
      QBIT_CHAIN: mainnet
      QBIT_EXPECTED_GENESIS_HASH: 0000000000004d60aa5d46013991d0a0e2995d89ee98e53068ae196d763e79f2
      QBIT_RPC_HOST: qbitd
      QBIT_RPC_PORT: "8352"
      QBIT_RPC_USER: qbitrpc
      QBIT_RPC_PASSWORD: ${APP_PASSWORD}
      QBIT_MINER_ADDRESS_FILE: /config/qbt-payout-address.txt
      QBIT_AUXPOW_CHAIN_ID: "47"
      BITCOIN_CHAIN: mainnet
      BITCOIN_EXPECTED_GENESIS_HASH: 000000000019d6689c085ae165831e934ff763ae46a2a6c172b3f1b60a8ce26f
      BITCOIN_RPC_HOST: ${APP_BITCOIN_NODE_IP}
      BITCOIN_RPC_PORT: ${APP_BITCOIN_RPC_PORT}
      BITCOIN_RPC_USER: ${APP_BITCOIN_RPC_USER}
      BITCOIN_RPC_PASSWORD: ${APP_BITCOIN_RPC_PASS}
      BITCOIN_MINER_ADDRESS_FILE: /config/btc-payout-address.txt
      FRACTAL_CHAIN: mainnet
      FRACTAL_RPC_HOST: ${APP_FRACTAL_RPC_HOST}
      FRACTAL_RPC_PORT: ${APP_FRACTAL_RPC_PORT}
      FRACTAL_RPC_USER: ${APP_FRACTAL_RPC_USER}
      FRACTAL_RPC_PASSWORD: ${APP_FRACTAL_RPC_PASS}
      FRACTAL_AUXPOW_CHAIN_ID: ${APP_FRACTAL_AUXPOW_CHAIN_ID}
      FRACTAL_MINER_ADDRESS_FILE: /config/fractal-payout-address.txt
      AUXPOW_MERKLE_SIZE: "16"
      AUXPOW_MERKLE_NONCE: "0"
      AUXPOW_ADDRESS_POLL_SECONDS: "2"
      AUXPOW_TELEMETRY_FILE: /telemetry/telemetry.json

    volumes:
      - ${APP_DATA_DIR}/config:/config:ro
      - ${APP_DATA_DIR}/telemetry:/telemetry

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python3 -c "import socket; s=socket.create_connection(('127.0.0.1',3336),2); s.close()"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Dedicated high-difficulty endpoint for rented SHA-256 hashrate. Keeping
  # this separate lets small local miners use vardiff without breaking rental
  # marketplace verification, which expects the first advertised difficulty
  # to be at least 500,000.
  auxpow_rental:
    image: ghcr.io/qbitleap/qbitleapbtc-auxpow:0.5.7
    restart: unless-stopped

    depends_on:
      qbitd:
        condition: service_healthy

    environment:
      <<: *auxpow_environment
      AUXPOW_STRATUM_PORT: "4335"
      AUXPOW_STRATUM_VARDIFF_MIN_DIFF: "500000"
      AUXPOW_STRATUM_VARDIFF_STARTUP_DIFF: "500000"
      AUXPOW_STRATUM_MIN_ADVERTISED_DIFF: "500000"
      AUXPOW_TELEMETRY_FILE: /telemetry/rental/rental-telemetry.json

    ports:
      - "4335:4335"

    volumes:
      - ${APP_DATA_DIR}/config:/config:ro
      - ${APP_DATA_DIR}/telemetry:/telemetry

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python3 -c "import socket; s=socket.create_connection(('127.0.0.1',4335),2); s.close()"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  permissionless:
    image: ghcr.io/qbitleap/qbitleapbtc-ckpool:0.5.7
    restart: unless-stopped
    depends_on:
      qbitd:
        condition: service_healthy
    environment:
      QBIT_PRODUCTION: "1"
      QBIT_TOOLS_PRODUCTION: "1"
      QBIT_CHAIN: mainnet
      QBIT_RPC_HOST: qbitd
      QBIT_RPC_PORT: "8352"
      QBIT_RPC_USER: qbitrpc
      QBIT_RPC_PASSWORD: ${APP_PASSWORD}
      CKPOOL_MINDIFF: "1024"
      CKPOOL_STARTDIFF: "8192"
      CKPOOL_MAXDIFF: "4294967296"
      CKPOOL_STRATUM_PORT: "3333"
      CKPOOL_PUBLIC_DIFF_POLICY: explicit
      CKPOOL_NON_TEST_READINESS_GATE: "1"
      CKPOOL_MIN_PEERS: "1"
      CKPOOL_REQUIRE_P2MR_PAYOUT: "1"
      QBIT_EXPECTED_ADDRESS_HRP: qb
      QBIT_EXPECTED_GENESIS_HASH: 0000000000004d60aa5d46013991d0a0e2995d89ee98e53068ae196d763e79f2
      CKPOOL_VERSION_MASK: 1fffe000
      CKPOOL_VERSION_MASK_MODE: dynamic
    volumes:
      - ${APP_DATA_DIR}/config:/config:ro
      - ${APP_DATA_DIR}/telemetry/permissionless-ckpool:/var/log/ckpool
    command:
      - /bin/bash
      - -lc
      - |
        set -euo pipefail
        for attempt in $$(seq 1 300); do
          if [[ -s /config/qbt-payout-address.txt ]]; then
            export QBIT_MINER_ADDRESS="$$(tr -d '\r\n' < /config/qbt-payout-address.txt)"
            exec /usr/local/bin/start-ckpool.sh
          fi
          sleep 1
        done
        echo "permissionless: timed out waiting for the Qbit payout address" >&2
        exit 1
    healthcheck:
      test: [CMD-SHELL, "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/3333'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  permissionless_telemetry:
    image: ghcr.io/qbitleap/qbitleapbtc-dashboard:0.5.7
    restart: unless-stopped
    command: [python, /app/permissionless_telemetry.py]
    environment:
      CKPOOL_STATUS_FILE: /ckpool/pool/rejects.status
      PERMISSIONLESS_TELEMETRY_FILE: /telemetry/permissionless.json
      PERMISSIONLESS_STATE_FILE: /telemetry/permissionless-state.json
      QBT_ADDRESS_FILE: /config/qbt-payout-address.txt
      QBIT_RPC_HOST: qbitd
      QBIT_RPC_PORT: "8352"
      QBIT_RPC_USER: qbitrpc
      QBIT_RPC_PASSWORD: ${APP_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/telemetry/permissionless-ckpool:/ckpool:ro
      - ${APP_DATA_DIR}/telemetry:/telemetry
      - ${APP_DATA_DIR}/config:/config:ro
    depends_on:
      permissionless:
        condition: service_started

  stratum_router:
    image: ghcr.io/qbitleap/qbitleapbtc-dashboard:0.5.7
    restart: unless-stopped
    command: [python, /app/router.py]
    environment:
      ROUTER_PORT: "3335"
      MODE_FILE: /config/mining-mode.txt
      ROUTER_STATUS_FILE: /telemetry/router-status.json
      QBT_ADDRESS_FILE: /config/qbt-payout-address.txt
      AUXPOW_BACKEND_HOST: auxpow
      AUXPOW_BACKEND_PORT: "3336"
      PERMISSIONLESS_BACKEND_HOST: permissionless
      PERMISSIONLESS_BACKEND_PORT: "3333"
    ports:
      - "3335:3335"
    volumes:
      - ${APP_DATA_DIR}/config:/config:ro
      - ${APP_DATA_DIR}/telemetry:/telemetry
    depends_on:
      auxpow:
        condition: service_started
      permissionless:
        condition: service_started
    healthcheck:
      test: [CMD-SHELL, "python -c \"import socket; s=socket.create_connection(('127.0.0.1',3335),2); s.close()\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
