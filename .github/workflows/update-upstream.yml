name: Propose upstream update

on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-qbit-mining-bootstrap
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: https://github.com/Qbit-Org/qbit-mining-bootstrap.git
  VENDORED_DIRECTORY: qbitleap-qbitleapbtc/upstream/qbit-mining-bootstrap

jobs:
  propose-update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Load pinned upstream commit
        shell: bash
        run: |
          set -euo pipefail
          printf 'PINNED_COMMIT=%s\n' "$(tr -d '[:space:]' < UPSTREAM_COMMIT)" >> "${GITHUB_ENV}"

      - name: Fetch official upstream main
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          git clone --branch main --depth 1 "${UPSTREAM_REPOSITORY}" "${RUNNER_TEMP}/qbit-mining-bootstrap"
          upstream_commit="$(git -C "${RUNNER_TEMP}/qbit-mining-bootstrap" rev-parse HEAD)"
          printf 'UPSTREAM_COMMIT=%s\n' "${upstream_commit}" >> "${GITHUB_ENV}"
          if [[ "${upstream_commit}" == "${PINNED_COMMIT}" ]]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Stop when the pin is current
        if: steps.upstream.outputs.changed == 'false'
        run: echo "The vendored upstream pin is current."

      - name: Replace the vendored snapshot
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude=.git/ \
            "${RUNNER_TEMP}/qbit-mining-bootstrap/" \
            "${VENDORED_DIRECTORY}/"
          printf '%s\n' "${UPSTREAM_COMMIT}" > UPSTREAM_COMMIT
          sed -i "s/${PINNED_COMMIT}/${UPSTREAM_COMMIT}/g" UPSTREAM.md

      - name: Verify proposed snapshot
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git -C "${RUNNER_TEMP}/qbit-mining-bootstrap" ls-tree -r HEAD > "${RUNNER_TEMP}/official-tree.txt"
          git add --all
          repository_tree="$(git write-tree)"
          git ls-tree -r "${repository_tree}" -- "${VENDORED_DIRECTORY}" \
            | sed "s#	${VENDORED_DIRECTORY}/#	#" \
            > "${RUNNER_TEMP}/vendored-tree.txt"
          diff -u "${RUNNER_TEMP}/official-tree.txt" "${RUNNER_TEMP}/vendored-tree.txt"

      - name: Commit and push to main
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update qbit-mining-bootstrap upstream to ${UPSTREAM_COMMIT:0:12}"
          git push origin HEAD:main
