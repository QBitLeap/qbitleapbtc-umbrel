name: Verify vendored upstream

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  UPSTREAM_REPOSITORY: https://github.com/Qbit-Org/qbit-mining-bootstrap.git
  VENDORED_DIRECTORY: qbitleap-qbitleapbtc/upstream/qbit-mining-bootstrap

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Load pinned upstream commit
        shell: bash
        run: |
          set -euo pipefail
          printf 'UPSTREAM_COMMIT=%s\n' "$(tr -d '[:space:]' < UPSTREAM_COMMIT)" >> "${GITHUB_ENV}"

      - name: Fetch pinned upstream tree
        shell: bash
        run: |
          set -euo pipefail
          git init "${RUNNER_TEMP}/qbit-mining-bootstrap"
          git -C "${RUNNER_TEMP}/qbit-mining-bootstrap" remote add origin "${UPSTREAM_REPOSITORY}"
          git -C "${RUNNER_TEMP}/qbit-mining-bootstrap" fetch --depth 1 origin "${UPSTREAM_COMMIT}"

      - name: Verify paths, contents, and executable bits
        shell: bash
        run: |
          set -euo pipefail
          git -C "${RUNNER_TEMP}/qbit-mining-bootstrap" ls-tree -r FETCH_HEAD > "${RUNNER_TEMP}/official-tree.txt"
          git ls-tree -r "HEAD:${VENDORED_DIRECTORY}" > "${RUNNER_TEMP}/vendored-tree.txt"
          diff -u "${RUNNER_TEMP}/official-tree.txt" "${RUNNER_TEMP}/vendored-tree.txt"
